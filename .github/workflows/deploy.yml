name: Deploy Tap2Connect

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /home/tap2connectnepal.com/deploy.sh
            cd /home/tap2connectnepal.com/public_html
            ./venv/bin/python manage.py shell -c "from django.contrib.auth import get_user_model; from vcards.models import College, OrganizationTeamMember; from vcards.views import _resolve_user_workspace; from vcards.platform_access import get_allowed_platform_modules; o=College.objects.select_related('admin_user').filter(workspace_slug__iexact='jyapu-cafe').first(); u=o.admin_user if o else None; print('JYAPU_ACCESS_DIAGNOSTIC', {'organization_found': bool(o), 'organization_id': o.pk if o else None, 'admin_assigned': bool(u), 'admin_username': u.username if u else None, 'admin_active': u.is_active if u else None, 'admin_superuser': u.is_superuser if u else None, 'admin_staff': u.is_staff if u else None, 'platform_modules': get_allowed_platform_modules(u) if u else [], 'team_rows': list(OrganizationTeamMember.objects.filter(organization=o).values('user_id','role','status')) if o else [], 'normal_workspace': _resolve_user_workspace(u, surface='normal') if u else None})"
            ./venv/bin/python manage.py shell -c "from django.test import Client; from vcards.models import College; o=College.objects.select_related('admin_user').get(workspace_slug__iexact='jyapu-cafe'); c=Client(HTTP_HOST='tap2connectnepal.com'); c.force_login(o.admin_user); paths=['/jyapu-cafe/dashboard/','/api/organizations/4/venue/','/api/organizations/4/venue/overview/?days=7','/api/organizations/4/venue/settings/']; print('JYAPU_REQUEST_DIAGNOSTIC', [(path, c.get(path, secure=True).status_code) for path in paths])"
            sudo find /var/log/nginx /home/tap2connectnepal.com -maxdepth 3 -type f -iname '*access*log*' -print 2>/dev/null | head -n 20
            sudo find /var/log/nginx /home/tap2connectnepal.com -maxdepth 3 -type f -iname '*access*log*' -print0 2>/dev/null | xargs -0 -r sudo zgrep -hE 'api/(platform/)?session/login|api/organizations/[0-9]+/venue' | awk '{print "WORKSPACE_REQUEST_DIAGNOSTIC", $4, $5, $6, $7, $9}' | tail -n 40
