name: Diagnose production table ordering

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce an order without saving it
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/tap2connectnepal.com/public_html
            ./venv/bin/python manage.py shell <<'PY'
            import traceback
            from decimal import Decimal
            from django.db import transaction
            from django.utils import timezone
            from hospitality.models import VenueProfile, VenueTouchpoint, VenueTableSession, VenueMenuItem, VenueOrder, VenueOrderItem
            from hospitality.views import _attach_order_to_bill

            venue = VenueProfile.objects.get(public_identifier='YVj3Ss7VM6QenPGsGzf_bDYS')
            table = VenueTouchpoint.objects.get(venue=venue, public_identifier='xfrVxsSj99eiZ8j5IE4aUCzt')
            session = VenueTableSession.objects.get(venue=venue, table=table, status='open')
            item = VenueMenuItem.objects.filter(venue=venue, is_published=True, is_available=True).first()
            print({'venue': venue.pk, 'table': table.pk, 'session': session.pk, 'item': item.pk if item else None})
            try:
                with transaction.atomic():
                    latest = venue.orders.select_for_update().order_by('-order_number').first()
                    order = VenueOrder.objects.create(
                        venue=venue, table=table, table_session=session,
                        order_number=(latest.order_number if latest else 0) + 1,
                        customer_name='diagnostic', status='accepted',
                        verified_at=timezone.now(), verified_by='diagnostic',
                        total=Decimal('1.00'), final_total=Decimal('1.00'),
                        table_session_expires_at=session.expires_at,
                    )
                    VenueOrderItem.objects.create(order=order, menu_item=item, name=item.name, unit_price=Decimal('1.00'), quantity=1)
                    bill = _attach_order_to_bill(order)
                    print({'result': 'ok', 'bill': bill.bill_number})
                    transaction.set_rollback(True)
            except Exception:
                traceback.print_exc()
                raise
            PY
